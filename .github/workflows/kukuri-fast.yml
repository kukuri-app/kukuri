name: Kukuri Fast

on:
  pull_request:
    paths:
      - '.config/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'xtask/**'
      - 'crates/**'
      - 'apps/**'
      - 'harness/**'
      - 'tools/check_iroh_resource_contract.py'
      - '.github/actions/**'
      - '.github/workflows/kukuri-fast.yml'
      - '.github/workflows/kukuri-nightly.yml'
      - '.github/workflows/kukuri-web-e2e.yml'
      - '.github/workflows/kukuri-release.yml'
  push:
    branches: [main, develop]
    paths:
      - '.config/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'xtask/**'
      - 'crates/**'
      - 'apps/**'
      - 'harness/**'
      - 'tools/check_iroh_resource_contract.py'
      - '.github/actions/**'
      - '.github/workflows/kukuri-fast.yml'
      - '.github/workflows/kukuri-nightly.yml'
      - '.github/workflows/kukuri-web-e2e.yml'
      - '.github/workflows/kukuri-release.yml'
  # #1800: 実際のアプリの試験（windows-fast）を毎晩も動かす。
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

# #1117: 同じ PR に続けて push したときは古い head の run を取り消し、runner の
# 同時実行枠を空ける。push / workflow_dispatch は run ごとに別 group にして取り消さない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  LINDERA_BUILD_DICTIONARY_CACHE_DIR: ${{ github.workspace }}/.cache/lindera
  # #1120: CI の dev / test build は行番号だけの debuginfo にし、link 時間と cache の容量を減らす。
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# #1413: Rust の依存の build 成果物は rust-cache（.github/actions/cache-rust）で GitHub Actions cache に
# 置く。key は job id・toolchain・Cargo.lock / Cargo.toml・CARGO_* の環境で分かれ、同じ job id の Nightly と
# 共有する。runner image が同梱する使わない toolchain は key に入れない。workspace crate は保存前に除かれる。
# 保存は PR 以外（main push・dispatch）の run だけにし、PR は main の cache を復元するだけにする
# （PR ごとの cache で容量を使い切らないため）。
jobs:
  linux-rust-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt

      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.23.4'

      # tauri-check は root workspace の外にある src-tauri を、その target へ build する。
      - name: Cache Rust
        uses: ./.github/actions/cache-rust
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Doctor
        run: cargo xtask-lite doctor

      - name: Oversized file report
        run: cargo xtask-lite oversized-files

      - name: Asset rights manifest
        run: cargo xtask-lite asset-check

      - name: Rust checks
        run: cargo xtask-lite rust-check

      - name: IPC types are in sync (Rust -> types.generated.ts)
        run: cargo xtask-lite ipc-types --check

      - name: Tauri compile check
        run: cargo xtask-lite tauri-check

  # nextest の test を hash で 2 つに分け、test build は両方で行う（build 5 分、test 7〜10 分の内訳で、
  # 待ちの長い test の実行だけを分ける）。
  linux-rust-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10

      - name: Cache Rust
        uses: ./.github/actions/cache-rust
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Rust tests
        run: cargo xtask-lite rust-test --partition hash:${{ matrix.shard }}/2

      - name: Setup Python for upstream resource contract
        if: matrix.shard == 1
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Pinned iroh resource contract
        if: matrix.shard == 1
        run: python tools/check_iroh_resource_contract.py

  # #1421: QUIC over WebRTC DataChannel の transport を headless の Chrome で試す（ADR 0057 §8 の E1〜E4）。
  linux-web-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install LLVM tools for the wasm C build
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: clang llvm

      - name: Cache Rust
        uses: ./.github/actions/cache-rust
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install wasm-bindgen test runner
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      # ブラウザでも動く共用 crate（ADR 0056 §2・§3）。時刻・task の直接使用も clippy が検出する。
      - name: Shared crates wasm32 clippy
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: >-
          cargo clippy --target wasm32-unknown-unknown
          -p kukuri-core -p kukuri-store -p kukuri-transport -p kukuri-iroh-node
          -p kukuri-docs-sync -p kukuri-blob-service -p kukuri-webrtc-transport
          -p kukuri-app-api -p kukuri-metaverse-host -p kukuri-desktop-runtime
          -p kukuri-web-runtime
          -- -D warnings

      - name: Browser transport tests
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" bash scripts/ci/browser_peer_test.sh kukuri-webrtc-transport webrtc_peer --features test-signaling

      # ブラウザ↔native の有界な読み出し（W1 AC-2）。
      - name: Browser node tests
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" bash scripts/ci/browser_peer_test.sh kukuri-iroh-node web_peer

      # IndexedDB の保存（blob と docs の record）と native との送受信（#1215 W2・#1216 W3、ADR 0058）。
      - name: Browser storage tests
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" bash scripts/ci/browser_peer_test.sh kukuri-web-runtime web_storage_peer

  # #1220 W8 AC-2a・#1559: 実ブラウザ（Chrome）の E2E。merge の条件（kukuri-web-e2e.yml）。
  web-e2e:
    uses: ./.github/workflows/kukuri-web-e2e.yml
    with:
      browser: chrome

  linux-desktop-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.23.4'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: ./.github/actions/cache-rust
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Desktop lint + typecheck
        run: cargo xtask-lite desktop-lint

      - name: Desktop Vitest
        run: cargo xtask-lite desktop-test

  linux-desktop-browser:
    # #1121 / #1413: Playwright は CPU を使い切る。4 CPU では既定の 2 worker で動かし、worker を
    # 増やさない（4 CPU に 4 worker を載せると metaverse の 3D test が timeout で落ちた）。
    # baseline を作る kukuri-visual-baseline.yml も同じ runner image で動かす。
    # 395 test（合計 1747 秒）を 2 worker で流すと 15 分かかるので、test を 2 つの job に分ける。--shard は
    # 件数で分けるため、3D の metaverse の spec（26 test で 822 秒）が片側に寄る。file で分ける（grep は testDir からの
    # file 名も対象に含む）。
    name: linux-desktop-browser (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            tests: --grep 'metaverse-[a-z-]*\.spec\.ts'
          - shard: 2
            tests: --grep-invert 'metaverse-[a-z-]*\.spec\.ts'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          extra-packages: fonts-noto-cjk

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.23.4'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: ./.github/actions/cache-rust
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Desktop Storybook build
        run: cargo xtask-lite desktop-storybook

      - name: Desktop browser tests
        run: cargo xtask-lite desktop-browser-test ${{ matrix.tests }}

      - name: Desktop visual regression tests
        if: matrix.shard == 1
        run: cargo xtask-lite desktop-visual-test

      - name: Upload visual regression diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-desktop-visual-diff-${{ matrix.shard }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore

  linux-cn:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          extra-packages: ffmpeg

      - name: Cache Rust
        uses: ./.github/actions/cache-rust
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Community-node checks
        run: cargo xtask-lite cn-check

      - name: Prepare community-node test images
        # #1742: fixture の参照名・版を保ち、Docker Hub の取得制限に依存せず同じテストを実行する。
        uses: ./.github/actions/cn-test-images

      - name: Community-node integration tests
        run: cargo xtask-lite cn-test

      # #1413: 同じ setup と依存の build を別 job で繰り返さないよう、linux-cn の中で続けて流す。
      - name: Community-node full-stack E2E
        run: cargo xtask-lite cn-e2e

  # #1413: Linux の `e2e-smoke`（desktop_smoke_post_persist）は、linux-rust-tests の nextest が
  # harness の test（crates/harness/src/tests/desktop_smoke.rs）として同じ scenario を流す。
  linux-community-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10

      - name: Cache Rust
        uses: ./.github/actions/cache-rust
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Prepare community-node test images
        uses: ./.github/actions/cn-test-images

      - name: Community-node connectivity scenario
        env:
          CN_POSTGRES_PORT: "55433"
          COMMUNITY_NODE_DATABASE_URL: postgres://cn:cn_password@127.0.0.1:55433/cn
        run: cargo xtask scenario community_node_public_connectivity

      - name: Community-node index client scenario
        env:
          KUKURI_DISABLE_KEYRING: "1"
        run: |
          cargo xtask scenario community_node_index_query_client
          cargo xtask scenario community_node_report_routing
          cargo xtask scenario community_node_trust_relation_client

      - name: Upload community-node artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-fast-community-node-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn

  windows-fast:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.23.4'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # root の target は harness 入りの xtask、src-tauri の target は tauri-check。
      - name: Cache Rust
        uses: ./.github/actions/cache-rust
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Doctor
        run: cargo xtask doctor

      - name: Oversized file report
        run: cargo xtask oversized-files

      - name: Windows Tauri compile check
        timeout-minutes: 20
        run: cargo xtask tauri-check

      - name: E2E smoke
        timeout-minutes: 15
        run: cargo xtask e2e-smoke

      - name: Upload kukuri artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-windows-fast-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn

  # 配布と同じ release build（10〜13 分）と実アプリの試験は、check 系の windows-fast と並行に動かす。
  # xtask は harness なしで足りる。
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.23.4'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: ./.github/actions/cache-rust
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Windows package
        # #1063: cache なしの実測 23〜25 分に対し、70% が 31.5 分となる値。
        timeout-minutes: 45
        run: cargo xtask-lite desktop-package

      # #1800: 配布と同じ build を同じ PC で複数起動し、画面と Rust のやり取りを含めて確かめる。音声は仮想の線
      # (VB-CABLE)を既定の入出力にして確かめる(全 instance が共有する)。
      - name: Install a virtual audio cable
        uses: AlekseyMartynov/action-vbcable-win@6ec0facd8780f0f463d7dc2fcfd630e06eb1fc0b

      - name: Real app tests
        timeout-minutes: 20
        shell: bash
        env:
          REAL_APP_AUDIO: vbcable
        run: >-
          node apps/desktop/tests/real-app/run.mjs
          --app apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/kukuri-desktop-tauri.exe
          --root "$RUNNER_TEMP/real-app"

      - name: Keep real app logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-real-app-windows
          path: ${{ runner.temp }}/real-app
          if-no-files-found: ignore

      - name: Upload NSIS installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-windows-nsis
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
          if-no-files-found: warn
