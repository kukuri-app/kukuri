name: Kukuri Flake Probe

# #1121: test の並列度を上げる変更の前後で、同じ suite を繰り返し実行して失敗率を測る。
# 手動起動のみ。lane ごとに 2 shard を並行させ、各 shard が `repeats` 回だけ suite を回す
# （既定は 2 shard × 10 回 = 20 回）。失敗しても最後まで回し、失敗回数を要約に出す。
# rust-cache の key は job id（rust / vitest / playwright）で分かれ、通常の CI の cache を上書きしない。

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Suite to probe'
        required: true
        default: all
        type: choice
        options:
          - all
          - rust
          - vitest
          - playwright
          - web-safari
          - apt
          - real-app-sa4
      repeats:
        description: 'Iterations per shard (2 shards run in parallel)'
        required: false
        default: '10'
        type: string
      apt_mirror:
        description: 'Initial Ubuntu mirror URL for the apt lane (empty uses the runner default)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  real-app-sa4:
    if: inputs.lane == 'real-app-sa4'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '^22.23.4'
      - uses: ./.github/actions/apt-install
        with:
          upgrade: 'true'
          extra-packages: xvfb openbox xdotool pulseaudio pulseaudio-utils libasound2-plugins
      - name: Use the observed release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40270708434 --repo kukuri-app/kukuri --name kukuri-linux-x86_64-test --dir "$RUNNER_TEMP/package"
          dpkg-deb -x "$RUNNER_TEMP/package/kukuri_0.4.9_amd64.deb" "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/usr/bin/kukuri-desktop-tauri"
          printf '%s  %s\n' 969c63aa04187d452fd3053da8d7cefa0c834bb8b8b3d65aa2e4b1524a418be4 "$app" | sha256sum --check
          echo "KUKURI_PROBE_APP=$app" >> "$GITHUB_ENV"
          # 調査用の一時変更。smokeから元のSA-4までを各回で起動し直す。
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/tests/real-app/scenarios/spatial-audio.mjs')
          source = path.read_text()
          assert '    await micOff(listener);' in source
          path.write_text(source.replace('    await micOff(listener);', '    await micOff(listener);\n    return;', 1))
          PY
          mkdir -p "$RUNNER_TEMP/sa4-probe"
          cat > "$RUNNER_TEMP/sa4-once.sh" <<'SH'
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/sa4-probe/attempt-XXXXXX")
          echo "probe root: $root"
          node apps/desktop/tests/real-app/run.mjs --app "$KUKURI_PROBE_APP" --root "$root" --scenario smoke --scenario spatial-audio | tee "$root/stdout.log"
          SH
      - name: Observe the original SA-4 conditions
        env:
          REAL_APP_AUDIO: pulse
          KUKURI_PROBE_REPEATS: ${{ inputs.repeats }}
          KUKURI_PROBE_LABEL: Linux SA-4 (observed release)
        run: |
          set -euo pipefail
          [[ "$KUKURI_PROBE_REPEATS" =~ ^([1-9]|1[0-2])$ ]]
          sudo prlimit --pid $$ --rtprio=95 --nice=40
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash -c '
            set -euo pipefail
            openbox &
            pulseaudio --start --exit-idle-time=-1
            ps -L -o cls= -p "$(pgrep -d, -x pulseaudio)" | grep RR > /dev/null
            bash scripts/ci/flake_probe.sh bash "$RUNNER_TEMP/sa4-once.sh"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kukuri-sa4-probe
          path: |
            ${{ runner.temp }}/sa4-probe/**/stdout.log
            ${{ runner.temp }}/sa4-probe/**/app.log
            ${{ runner.temp }}/sa4-probe/**/sa4/**

  apt:
    if: inputs.lane == 'apt'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          mirror: ${{ inputs.apt_mirror }}

  web-safari:
    if: inputs.lane == 'web-safari'
    uses: ./.github/workflows/kukuri-web-e2e.yml
    with:
      browser: safari
      scenario: lifecycle
      repeats: ${{ inputs.repeats }}

  rust:
    if: ${{ inputs.lane == 'all' || inputs.lane == 'rust' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10

      - name: Cache Rust
        uses: ./.github/actions/cache-rust

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Repeat rust-test
        env:
          KUKURI_PROBE_REPEATS: ${{ inputs.repeats }}
          KUKURI_PROBE_LABEL: rust (shard ${{ matrix.shard }})
        run: bash scripts/ci/flake_probe.sh cargo xtask-lite rust-test

  vitest:
    if: ${{ inputs.lane == 'all' || inputs.lane == 'vitest' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.23.4'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: ./.github/actions/cache-rust

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Repeat desktop-test
        env:
          KUKURI_PROBE_REPEATS: ${{ inputs.repeats }}
          KUKURI_PROBE_LABEL: vitest (shard ${{ matrix.shard }})
        run: bash scripts/ci/flake_probe.sh cargo xtask-lite desktop-test

  playwright:
    if: ${{ inputs.lane == 'all' || inputs.lane == 'playwright' }}
    # #1121: CI 本体の linux-desktop-browser と同じ runner で測る。
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.23.4'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: ./.github/actions/cache-rust

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Repeat desktop-browser-test
        env:
          KUKURI_PROBE_REPEATS: ${{ inputs.repeats }}
          KUKURI_PROBE_LABEL: playwright (shard ${{ matrix.shard }})
        run: bash scripts/ci/flake_probe.sh cargo xtask-lite desktop-browser-test
