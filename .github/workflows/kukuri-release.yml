name: Kukuri Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag for the verified candidate (existing assets are never replaced)'
        required: true
        type: string
      draft:
        description: 'Create the GitHub Release as a draft'
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 10.16.1

# #1180 / #1413: release は不定期で、cache の復元・保存は時間だけかかるため使わない。PR の run が
# 書いた cache を署名付きの配布物へ持ち込まないよう、release の経路に cache の step を置かない。
# build / verify と署名する job は Linux が Ubuntu 22.04（配布物の glibc の下限）、Windows が
# Windows Server 2022 の GitHub-hosted runner で動く。
jobs:
  validate-release-inputs:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_draft: ${{ steps.release.outputs.release_draft }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_source: ${{ steps.source.outputs.release_source }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve release input
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_DRAFT: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
        run: |
          set -euo pipefail
          python3 scripts/release/release_assets.py resolve-input --event "$GITHUB_EVENT_NAME" \
            --tag "$RELEASE_TAG" --ref "$GITHUB_REF" --draft "$RELEASE_DRAFT" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.release_tag }}

      - name: Pin source once
        id: source
        env:
          WORKFLOW_SOURCE: ${{ github.workflow_sha }}
        run: |
          source=$(git rev-parse HEAD)
          test "$source" = "$WORKFLOW_SOURCE" || { echo 'Select the same workflow ref as the release tag' >&2; exit 1; }
          echo "release_source=$source" >> "$GITHUB_OUTPUT"

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Release version gate
        run: cargo xtask release-check ${{ steps.release.outputs.release_tag }}

  # #1180: 検証の中身は PR でも走らせる reusable workflow に置く。
  linux-verify:
    needs: validate-release-inputs
    uses: ./.github/workflows/kukuri-release-verify.yml
    with:
      source_ref: ${{ needs.validate-release-inputs.outputs.release_source }}
      release_tag: ${{ needs.validate-release-inputs.outputs.release_tag }}

  # #1180: 署名する package job は linux-verify を待たずに始める。公開は publish-draft が
  # changelog 経由で linux-verify の成功を必要とすることで担保する。
  linux-package:
    needs: validate-release-inputs
    uses: ./.github/workflows/kukuri-linux-package.yml
    with:
      source_ref: ${{ needs.validate-release-inputs.outputs.release_source }}
      signing: distribution
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}

  cli-package:
    needs: validate-release-inputs
    uses: ./.github/workflows/kukuri-cli-package.yml
    with:
      source_ref: ${{ needs.validate-release-inputs.outputs.release_source }}

  windows-package:
    needs: validate-release-inputs
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    # #1180: 署名鍵は job 全体ではなく、使う step の env にだけ渡す（依存 package の install
    # script や setup 系 action から見えないようにする）。
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-inputs.outputs.release_source }}

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy,rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # package の記録 step が python を使う。runner の image に入っている版を前提にしない。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Release version gate
        run: cargo xtask release-check ${{ needs.validate-release-inputs.outputs.release_tag }}

      - name: Configure updater signing key
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) {
            throw "TAURI_UPDATER_PUBLIC_KEY secret is required and must match TAURI_SIGNING_PRIVATE_KEY"
          }
          $configPath = "apps/desktop/src-tauri/tauri.conf.json"
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $config.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBLIC_KEY.Trim()
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configPath -Encoding UTF8

      - name: Windows Tauri compile check
        run: cargo xtask tauri-check

      - name: Build Windows package
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 鍵が無いと xtask は updater 成果物なしで build を続けるため、ここで止める。
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY secret is required for preview updater artifacts"
          }
          cargo xtask desktop-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify updater signature trust boundary
        shell: pwsh
        run: |
          $bundleDir = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $bundle = Get-ChildItem -LiteralPath $bundleDir -File -Filter '*.exe' |
            Where-Object { Test-Path -LiteralPath "$($_.FullName).sig" } |
            Select-Object -First 1
          if (-not $bundle) {
            throw "no signed updater bundle found in $bundleDir"
          }
          $env:KUKURI_UPDATER_BUNDLE = $bundle.FullName
          $env:KUKURI_UPDATER_SIGNATURE = "$($bundle.FullName).sig"
          cargo test `
            --manifest-path apps/desktop/src-tauri/Cargo.toml `
            --test updater_signature `
            -- `
            --ignored `
            --nocapture

      - name: Record Windows package source and hashes
        shell: pwsh
        env:
          RELEASE_SOURCE: ${{ needs.validate-release-inputs.outputs.release_source }}
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.release_version }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $bundleDir = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $files = @(Get-ChildItem -LiteralPath $bundleDir -File | Where-Object { $_.Extension -in '.exe', '.msi', '.zip', '.sig' })
          $updater = $files | Where-Object Extension -eq '.zip' | Select-Object -First 1
          if (-not $updater) { $updater = $files | Where-Object Extension -eq '.exe' | Select-Object -First 1 }
          if (-not $updater) { throw 'Missing Windows updater' }
          $keyName = 'windows-x86_64-updater-key.pub'
          [IO.File]::WriteAllText((Join-Path $bundleDir $keyName), $env:TAURI_UPDATER_PUBLIC_KEY.Trim(), [Text.UTF8Encoding]::new($false))
          $arguments = @('scripts/release/release_assets.py', 'package', '--directory', $bundleDir,
            '--target', 'windows-x86_64', '--version', $env:RELEASE_VERSION, '--source', $env:RELEASE_SOURCE,
            '--signing', 'distribution', '--updater', $updater.Name, '--public-key-file', $keyName, '--file', $keyName)
          foreach ($file in $files) { $arguments += @('--file', $file.Name) }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows package metadata failed' }

      - name: Export the already-built signature verifier
        shell: pwsh
        env:
          RELEASE_SOURCE: ${{ needs.validate-release-inputs.outputs.release_source }}
        run: |
          $messages = cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test updater_signature --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Signature verifier build failed' }
          $binary = $messages | ForEach-Object { try { $_ | ConvertFrom-Json } catch {} } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'updater_signature' -and $_.executable } |
            Select-Object -Last 1 -ExpandProperty executable
          if (-not $binary) { throw 'Signature verifier binary is missing' }
          New-Item -ItemType Directory -Path dist/updater-verifier | Out-Null
          Copy-Item -LiteralPath $binary -Destination dist/updater-verifier/updater-verifier.exe
          [IO.File]::WriteAllText('dist/updater-verifier/source-commit.txt', $env:RELEASE_SOURCE, [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: kukuri-updater-verifier
          if-no-files-found: error
          path: dist/updater-verifier/

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-windows-preview-bundle
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
          if-no-files-found: error

      - name: Attest Windows bundle
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*

  changelog:
    needs: [validate-release-inputs, linux-verify, windows-package, linux-package, cli-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout validated source for changelog generation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-inputs.outputs.release_source }}
          fetch-depth: 0

      - name: Changelog script smoke
        shell: pwsh
        run: ./scripts/release/test-update-changelog.ps1

      - name: Check changelog tag still matches validated source
        env:
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.release_tag }}
          RELEASE_SOURCE: ${{ needs.validate-release-inputs.outputs.release_source }}
        run: test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SOURCE"

      # #1186: 起点は公開済み Release の tag のうち最も近い祖先。Release の無い tag（失敗した
      # release）は git 上に残るので、update-changelog.ps1 の既定（git describe）に任せない。
      - name: Resolve previous published release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags.txt"
          python3 scripts/release/release_assets.py previous-release --tag "$RELEASE_TAG" \
            --published-tags "$RUNNER_TEMP/published-tags.txt" >> "$GITHUB_OUTPUT"

      - name: Generate changelog section
        shell: pwsh
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.previous_tag }}
        run: >
          ./scripts/release/update-changelog.ps1
          -Tag '${{ needs.validate-release-inputs.outputs.release_tag }}'
          -PreviousTag $env:PREVIOUS_TAG
          -Repository '${{ github.repository }}'
          -SectionOutputPath 'dist/changelog/CHANGELOG_SECTION.md'

      # Upload the section before proposing the CHANGELOG change so the release
      # asset embedding never depends on the pull request step succeeding.
      - name: Upload changelog section
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-changelog-section
          path: dist/changelog/CHANGELOG_SECTION.md
          if-no-files-found: error

      # The default branch requires pull requests, so the CHANGELOG update is
      # proposed as a PR instead of pushed directly. Best-effort: a failure here
      # must not block publishing the release.
      - name: Open CHANGELOG update pull request
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged; nothing to propose."
            exit 0
          fi
          tag="${{ needs.validate-release-inputs.outputs.release_tag }}"
          base="${{ github.event.repository.default_branch }}"
          branch="chore/changelog-${tag}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${tag}"
          git push origin "${branch}"
          if gh pr view "${branch}" --json number >/dev/null 2>&1; then
            echo "Pull request already exists for ${branch}."
          else
            gh pr create --base "${base}" --head "${branch}" \
              --title "docs: update CHANGELOG for ${tag}" \
              --body "Automated CHANGELOG update for ${tag}, generated by the release workflow."
          fi

  release-assets:
    needs: [validate-release-inputs, windows-package, linux-package, cli-package, changelog]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-inputs.outputs.release_source }}

      - name: Release asset script smoke
        shell: pwsh
        run: |
          ./scripts/release/test-create-preview-assets.ps1
          ./scripts/release/test-create-preview-assets-linux.ps1

      - name: Package and asset notice script smoke
        shell: pwsh
        run: ./scripts/release/test-generate-third-party-notices.ps1

      - name: Download Windows bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: kukuri-windows-preview-bundle
          path: dist/package-input/windows

      - name: Download Linux GUI bundle
        uses: actions/download-artifact@v4
        with:
          name: kukuri-linux-x86_64-distribution
          path: dist/package-input/linux

      - name: Download CLI bundles
        uses: actions/download-artifact@v4
        with:
          pattern: kukuri-cli-linux-*
          path: dist/package-input/cli

      - name: Download changelog section artifact
        uses: actions/download-artifact@v4
        with:
          name: kukuri-changelog-section
          path: dist/changelog

      - name: Download signature verifier from the same build
        uses: actions/download-artifact@v4
        with:
          name: kukuri-updater-verifier
          path: dist/updater-verifier

      - name: Generate release assets
        shell: pwsh
        run: >
          ./scripts/release/create-preview-assets.ps1
          -Tag '${{ needs.validate-release-inputs.outputs.release_tag }}'
          -Repository '${{ github.repository }}'
          -Version '${{ needs.validate-release-inputs.outputs.release_version }}'
          -InputDir 'dist/package-input'
          -OutputDir 'dist/release-assets'
          -ChangelogSectionPath 'dist/changelog/CHANGELOG_SECTION.md'
          -IncludeLinux
          -SourceCommit '${{ needs.validate-release-inputs.outputs.release_source }}'

      - name: Verify final manifest bundles with the real verifier
        shell: pwsh
        env:
          RELEASE_SOURCE: ${{ needs.validate-release-inputs.outputs.release_source }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.release_tag }}
        run: |
          if ((Get-Content -Raw dist/updater-verifier/source-commit.txt).Trim() -ne $env:RELEASE_SOURCE) { throw 'Verifier source mismatch' }
          ./scripts/release/test-published-updater-signature.ps1 -Tag $env:RELEASE_TAG `
            -Repository $env:GITHUB_REPOSITORY -Platforms 'windows-x86_64','linux-x86_64','linux-x86_64-deb' `
            -InputDir dist/release-assets -PublicKeyFile dist/release-assets/windows-x86_64-updater-key.pub `
            -VerifierExecutable (Resolve-Path dist/updater-verifier/updater-verifier.exe).Path

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-release-assets
          path: dist/release-assets/
          if-no-files-found: error

  publish-draft:
    needs: [validate-release-inputs, release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-inputs.outputs.release_source }}
          persist-credentials: false
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: kukuri-release-assets
          path: dist/release-assets

      - name: Create new draft and publish only a complete upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.release_tag }}
          RELEASE_SOURCE: ${{ needs.validate-release-inputs.outputs.release_source }}
          RELEASE_DRAFT: ${{ needs.validate-release-inputs.outputs.release_draft }}
        run: |
          python3 scripts/release/publish_preview.py --input dist/release-assets \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --source "$RELEASE_SOURCE" --draft "$RELEASE_DRAFT"

  verify-published:
    needs: [validate-release-inputs, publish-draft]
    if: ${{ needs.validate-release-inputs.outputs.release_draft == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-inputs.outputs.release_source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kukuri-release-assets
          path: dist/release-assets
      - name: Verify stable updater URL and public binaries
        env:
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.release_tag }}
          RELEASE_SOURCE: ${{ needs.validate-release-inputs.outputs.release_source }}
        run: |
          python3 scripts/release/verify_public_preview.py --input dist/release-assets \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --source "$RELEASE_SOURCE"
