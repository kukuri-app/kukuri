name: Kukuri Community Node Images

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/cn/**'
      - 'scripts/ci/cn_image_check.py'
      - 'scripts/ci/cn_indexer_smoke.sh'
      - 'crates/cn-*/**'
      - '.github/workflows/kukuri-cn-images.yml'
  push:
    branches: [main, develop]
    tags:
      - 'v*'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/cn/**'
      - 'scripts/ci/cn_image_check.py'
      - 'scripts/ci/cn_indexer_smoke.sh'
      - 'crates/cn-*/**'
      - '.github/workflows/kukuri-cn-images.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag to publish to GHCR (example: latest, v0.1.2-cn.1, 2026-06-28)'
        required: false
        default: 'latest'
        type: string
      push:
        description: 'Push images to GHCR'
        required: false
        default: true
        type: boolean

# #1117: 同じ PR に続けて push したときは古い head の run を取り消し、Namespace の
# 同時実行枠を空ける。push / workflow_dispatch は run ごとに別 group にして取り消さない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build community node images
    # #1117: 専用 profile（同時 runner 1）で動かし、Kukuri Fast の同時実行枠を食い尽くさない。
    # cargo の Cache Volume は使わないので cache-tag は付けない。
    runs-on: namespace-profile-kukuri-cn-images
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # #1122: 4 image 分の tag を先に決める。push は smoke の後にだけ行う。
      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::12}"
          push="false"
          extra_tag=""

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              if [[ "${{ github.event.inputs.push }}" == "true" ]]; then
                push="true"
              fi
              extra_tag="${{ github.event.inputs.image_tag }}"
              ;;
            push)
              push="true"
              if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                extra_tag="${GITHUB_REF_NAME}"
              elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
                extra_tag="latest"
              else
                extra_tag="${GITHUB_REF_NAME//\//-}"
              fi
              ;;
          esac

          mkdir -p "${RUNNER_TEMP}/cn-image-tags"
          for image in kukuri-cn-user-api kukuri-cn-iroh-relay kukuri-cn-cli kukuri-cn-indexer; do
            ref="${REGISTRY}/${owner}/${image}"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              printf '%s\n' "${ref}:pr-${{ github.event.pull_request.number }}-${short_sha}" \
                > "${RUNNER_TEMP}/cn-image-tags/${image}"
            else
              printf '%s\n' "${ref}:sha-${short_sha}" > "${RUNNER_TEMP}/cn-image-tags/${image}"
              if [[ -n "$extra_tag" ]]; then
                printf '%s\n' "${ref}:${extra_tag}" >> "${RUNNER_TEMP}/cn-image-tags/${image}"
              fi
            fi
          done

          {
            echo "owner=${owner}"
            echo "push=${push}"
          } >> "$GITHUB_OUTPUT"
          echo 'Tags:'
          for image in kukuri-cn-user-api kukuri-cn-iroh-relay kukuri-cn-cli kukuri-cn-indexer; do
            sed "s/^/  ${image}: /" "${RUNNER_TEMP}/cn-image-tags/${image}"
          done

      # #1122: 4 image を 1 回の build session で作る。builder stage を共有するので
      # 共通の依存 crate の compile は 1 回だけになる。ここでは registry へ出さず、
      # OCI layout（と smoke 用の docker archive）へ書き出す。
      - name: Build images
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          OUT_DIR: ${{ runner.temp }}/cn-images-out
        run: |
          set -euo pipefail
          docker buildx version
          mkdir -p "${OUT_DIR}"
          # context の外へ書き出すため、書き込み先を明示して許可する（buildx の filesystem entitlement）。
          docker buildx bake --file docker/cn/docker-bake.hcl --set '*.platform=linux/amd64' --progress plain --allow "fs.write=${OUT_DIR}"

      # Inspect every production layer and smoke the exact checked images before publish.
      - name: Check image contents, sizes and entrypoints
        run: python3 scripts/ci/cn_image_check.py "${{ runner.temp }}/cn-images-out"

      - name: Login to GHCR
        if: ${{ steps.meta.outputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # #1122: smoke が通った image だけを GHCR へ出す。build し直さず、書き出した
      # OCI layout の manifest（attestation を含む）をそのまま複製する。runner の
      # buildx（v0.32.1）は imagetools の source に oci-layout を取れないため regctl を使う。
      - name: Install regctl
        if: ${{ steps.meta.outputs.push == 'true' }}
        shell: bash
        env:
          REGCTL_VERSION: v0.11.6
          REGCTL_SHA256: 8e0e62a497fcdb8048d18aa927a139613176ba0531f412bc541044e28f9856bd
        run: |
          set -euo pipefail
          url="https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
          curl -fsSL -o "${RUNNER_TEMP}/regctl" "$url"
          echo "${REGCTL_SHA256}  ${RUNNER_TEMP}/regctl" | sha256sum --check --strict -
          chmod +x "${RUNNER_TEMP}/regctl"
          "${RUNNER_TEMP}/regctl" version --format '{{ .VCSTag }}'

      - name: Push images
        if: ${{ steps.meta.outputs.push == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/cn-images-out"
          for image in kukuri-cn-user-api kukuri-cn-iroh-relay kukuri-cn-cli kukuri-cn-indexer; do
            digest=$(jq -r '.manifests[0].digest' "${image}/index.json")
            if [[ -z "$digest" || "$digest" == "null" ]]; then
              echo "::error::${image}: OCI layout の digest を読めない"
              exit 1
            fi
            while read -r tag; do
              [[ -z "$tag" ]] && continue
              echo "pushing ${image} (${digest}) -> ${tag}"
              "${RUNNER_TEMP}/regctl" image copy "ocidir://${image}@${digest}" "$tag"
            done < "${RUNNER_TEMP}/cn-image-tags/${image}"
          done

      - name: Image summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Push: ${{ steps.meta.outputs.push }}"
          for image in kukuri-cn-user-api kukuri-cn-iroh-relay kukuri-cn-cli kukuri-cn-indexer; do
            echo "Image: ${image}"
            sed 's/^/  tag: /' "${RUNNER_TEMP}/cn-image-tags/${image}" || true
          done
