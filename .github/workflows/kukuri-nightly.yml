name: Kukuri Nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # #1120: CI の dev / test build は行番号だけの debuginfo にし、link 時間と cache の容量を減らす。
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# #1413: rust-cache の key は job id ごとで、同じ job id の Fast と共有する（kukuri-fast.yml 参照）。
jobs:
  linux-app-api-slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: App API slow iroh integration tests
        run: cargo xtask-lite app-api-slow-test

  # #1413: 他の desktop_smoke_* / pairwise_dm_* / private_channel_* の scenario と Linux の e2e-smoke は、
  # linux-rust-tests の nextest が harness の test（crates/harness/src/tests/）として流す。
  linux-additional-scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run scenario
        run: cargo xtask scenario desktop_smoke_metaverse_dome_delete

      - name: Upload scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-nightly-desktop_smoke_metaverse_dome_delete-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn

  linux-rust-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Doctor
        run: cargo xtask-lite doctor

      - name: Oversized file report
        run: cargo xtask-lite oversized-files

      - name: Rust checks
        run: cargo xtask-lite rust-check

      - name: Tauri compile check
        run: cargo xtask-lite tauri-check

  linux-rust-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Rust tests
        run: cargo xtask-lite rust-test

      - name: Setup Python for upstream resource contract
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Pinned iroh resource contract
        run: python tools/check_iroh_resource_contract.py

  linux-desktop-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Desktop lint + typecheck
        run: cargo xtask-lite desktop-lint

      - name: Desktop Vitest
        run: cargo xtask-lite desktop-test

  linux-desktop-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Desktop Storybook build
        run: cargo xtask-lite desktop-storybook

      - name: Desktop browser tests
        run: cargo xtask-lite desktop-browser-test

  linux-cn:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          ffmpeg
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Community-node checks
        run: cargo xtask-lite cn-check

      - name: Community-node integration tests
        run: cargo xtask-lite cn-test

  linux-community-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Community-node connectivity scenario
        env:
          CN_POSTGRES_PORT: "55433"
          COMMUNITY_NODE_DATABASE_URL: postgres://cn:cn_password@127.0.0.1:55433/cn
        run: cargo xtask scenario community_node_public_connectivity

      - name: Upload community-node artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-nightly-community-node-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn

  linux-community-node-multi-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Community-node multi-device scenario
        env:
          CN_POSTGRES_PORT: "55434"
          COMMUNITY_NODE_DATABASE_URL: postgres://cn:cn_password@127.0.0.1:55434/cn
        run: cargo xtask scenario community_node_multi_device_connectivity

      - name: Upload multi-device artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-nightly-community-node-multi-device-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn
