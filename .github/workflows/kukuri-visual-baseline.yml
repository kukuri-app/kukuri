name: Kukuri Visual Baseline

# 視覚回帰 baseline（Linux/Chromium）を生成し artifact として吐き出す（WP-S7 T1）。
# CI 環境では process.env.CI が自動設定され playwright.config の ignoreSnapshots が false に
# なるため、--update-snapshots で __screenshots__/ を生成できる。手動 dispatch 専用。
# kukuri-fast.yml の必須ジョブには一切手を入れない（step 追加は T2）。
on:
  workflow_dispatch:
    inputs:
      commit_to_branch:
        description: >-
          生成した baseline を対象ブランチへ commit / push する（artifact をダウンロードできない環境向け。
          GITHUB_TOKEN の push は他の workflow を起動しないため、CI を流すには別 commit を push する）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-baseline:
    # #1413: 比較側（kukuri-fast.yml の linux-desktop-browser）と同じ runner image で生成する。
    # image を変えるときは両方を同時に変える（フォント / AA 差で baseline が一斉に割れる）。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
          fonts-noto-cjk

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Generate visual baseline
        working-directory: apps/desktop
        run: pnpm test:e2e:visual --update-snapshots

      - name: Upload visual baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-desktop-visual-baseline
          path: apps/desktop/tests/playwright/__screenshots__/
          if-no-files-found: warn

      - name: Commit visual baseline to branch
        if: ${{ inputs.commit_to_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/tests/playwright/__screenshots__/
          if git diff --cached --quiet; then
            echo "baseline unchanged"
            exit 0
          fi
          git commit -m "chore(desktop): 視覚回帰 baseline を再生成 (Kukuri Visual Baseline ${{ github.run_id }})"
          git push origin HEAD:${{ github.ref_name }}
