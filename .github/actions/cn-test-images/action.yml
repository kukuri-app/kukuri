name: Prepare community-node test images
description: Load fixture images from the Docker Hub cache, falling back to Docker Hub if the cache fails.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        for image in library/postgres:17-bookworm valkey/valkey:8-alpine; do
          if docker pull "mirror.gcr.io/$image"; then
            docker tag "mirror.gcr.io/$image" "${image#library/}"
          else
            echo "Mirror pull failed; pulling $image from Docker Hub" >&2
            docker pull "$image"
          fi
        done
