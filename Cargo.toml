[workspace]
members = [
    "xtask",
    "crates/core",
    "crates/metaverse-host",
    "crates/store",
    "crates/transport",
    "crates/iroh-node",
    "crates/cn-protocol",
    "crates/docs-sync",
    "crates/webrtc-transport",
    "crates/web-runtime",
    "crates/blob-service",
    "crates/harness",
    "crates/app-api",
    "crates/desktop-runtime",
    "crates/kukuri-cli",
    "crates/test-support",
    "crates/cn-core",
    "crates/cn-user-api",
    "crates/cn-iroh-relay",
    "crates/cn-stun",
    "crates/cn-cli",
    "crates/cn-operator",
    "crates/cn-safety",
    "crates/cn-safety-arachnid",
    "crates/cn-safety-runtime",
    "crates/cn-safety-vlm",
    "crates/cn-safety-openai",
    "crates/cn-safety-video",
    "crates/cn-runtime-support",
    "crates/cn-trust",
    "crates/cn-indexer",
    "crates/cn-e2e",
]
exclude = [
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.4.1"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
# `fs` は native で iroh-blobs の fs-store が有効にする（wasm には file が無い）。
bao-tree = { version = "0.16.1", default-features = false, features = ["serde", "tokio_fsm", "validate"] }
bech32 = "0.12.0"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "jpeg", "webp"] }
# Custom Transport（QUIC over WebRTC DataChannel。ADR 0057）を Endpoint の組立てへ注入する。
iroh = { version = "1.3.0", features = ["unstable-custom-transports"] }
# 永続 store（fs-store）と rpc は native の節で足す（ADR 0056 §3、ADR 0058）。
iroh-docs = { version = "0.101.0", default-features = false }
iroh-blobs = { version = "0.103.0", default-features = false }
iroh-gossip = "0.101.0"
iroh-mainline-address-lookup = "0.6.0"
iroh-relay = { version = "1.3.0", features = ["server"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
keyring = { version = "4.2.0", default-features = false }
libc = "0.2.189"
chacha20poly1305 = "0.11.0"
n0-future = "0.3.2"
n0-mainline = "0.7.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rapier3d = { version = "0.36.0", features = ["enhanced-determinism"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
secp256k1 = { version = "0.33.1", features = ["global-context", "rand", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "postgres", "json", "migrate", "chrono"] }
thiserror = "2.0.21"
# 共用 crate は wasm でも build する（ADR 0056 §3）。rt-multi-thread・fs 等は使う crate が native の節で足す。
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tower_governor = "0.8.0"
ts-rs = "12"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["serde", "v4", "v7"] }
web-time = "1.1.0"
wiremock = "0.6"

[patch.crates-io]
# Upstream #114: sync_process_message error must not panic the whole docs actor.
iroh-docs = { git = "https://github.com/n0-computer/iroh-docs", rev = "e7233d14853cb4db9966e30050bac1e689cdeec8" }
# Upstream #4447: release inactive endpoint/relay address mappings.
# Upstream #4565: Endpoint::add_remote_addrs opens a custom path on a live connection (#1422).
# fork だけの変更（#1482・#1571。上流へは PR を出さない）: custom transport が外した local addr の custom path をすぐ閉じ、
# その path を選ばず、それだけが残った接続を 3 秒で閉じる。
# fork の rev は、上流 v1.3.0 に #4447（#1450 で rebase）・#4565 の cherry-pick・#1482 と #1571 の変更を載せたもの。
# Keep the shared public types on the same source as the endpoint crate.
iroh = { git = "https://github.com/KingYoSun/iroh", rev = "e0b0ad9892e8881480d0f48a74a3148c8b896d79" }
iroh-base = { git = "https://github.com/KingYoSun/iroh", rev = "e0b0ad9892e8881480d0f48a74a3148c8b896d79" }
iroh-dns = { git = "https://github.com/KingYoSun/iroh", rev = "e0b0ad9892e8881480d0f48a74a3148c8b896d79" }
iroh-relay = { git = "https://github.com/KingYoSun/iroh", rev = "e0b0ad9892e8881480d0f48a74a3148c8b896d79" }
# Upstream #162 includes #161: release idle connections and retired peer state.
# The fork adds on top of #162: reopen shared topic streams on a superseding connection (#1376),
# and answer a join while an earlier neighbor request to the peer is pending (#1549).
iroh-gossip = { git = "https://github.com/KingYoSun/iroh-gossip", rev = "23cd6cc76d51582b3678b3b743db72d51ce296d4" }

[workspace.lints.clippy]
unwrap_used = "warn"
# clippy.toml の一覧。共用 crate の lib.rs だけで warn にする（ADR 0056 §3）。
disallowed_methods = "allow"

# Web の配信の WASM（`cargo xtask web-build`）。1 file 25 MiB の上限の下に収める（ADR 0060 §2）。
[profile.web-release]
inherits = "release"
lto = "fat"
codegen-units = 1
