[package]
name = "kukuri-desktop-tauri"
version = "0.4.3"
edition = "2024"
default-run = "kukuri-desktop-tauri"

[lib]
name = "kukuri_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
microsoft-store = []

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
html5ever = "0.40.1"
kukuri-app-api = { path = "../../../crates/app-api" }
kukuri-core = { path = "../../../crates/core" }
kukuri-desktop-runtime = { path = "../../../crates/desktop-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-deep-link = "2.6.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-updater = "2.13.1"
tokio = { version = "1", features = ["time", "signal", "sync", "net", "macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.1", features = ["deep-link"] }

# Android の証明書の検証へ JVM と Context を渡す（#1195。reqwest と iroh の TLS が使う rustls-platform-verifier）。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7.1"

[target.'cfg(windows)'.dependencies]
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Globalization", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
# Keep zbus's blocking Secret Service client compatible with async startup.
# Enabling ashpd/tokio also enables zbus/tokio through Cargo feature unification.
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "open_uri"] }
zbus = "5"

[dev-dependencies]
minisign-verify = "0.3"
tauri = { version = "2.12.0", features = ["test"] }
tempfile = "3.27.0"

[patch.crates-io]
# Keep the standalone Tauri workspace on the same docs error-path fix as the root.
iroh-docs = { git = "https://github.com/n0-computer/iroh-docs", rev = "e7233d14853cb4db9966e30050bac1e689cdeec8" }
# Match the root workspace's inactive address/connection reclamation fixes.
iroh = { git = "https://github.com/KingYoSun/iroh", rev = "eef6af69364b5df1aa33c30e4c5731aad9d32046" }
iroh-base = { git = "https://github.com/KingYoSun/iroh", rev = "eef6af69364b5df1aa33c30e4c5731aad9d32046" }
iroh-dns = { git = "https://github.com/KingYoSun/iroh", rev = "eef6af69364b5df1aa33c30e4c5731aad9d32046" }
iroh-relay = { git = "https://github.com/KingYoSun/iroh", rev = "eef6af69364b5df1aa33c30e4c5731aad9d32046" }
iroh-gossip = { git = "https://github.com/KingYoSun/iroh-gossip", rev = "23cd6cc76d51582b3678b3b743db72d51ce296d4" }
# Match the root workspace's Mainline forks (#1632).
n0-mainline = { git = "https://github.com/KingYoSun/n0-mainline", rev = "7571f18f69ef03d9ec97ca8d1171e17c8ce4f0c6" }
iroh-mainline-address-lookup = { git = "https://github.com/KingYoSun/iroh-address-lookups", rev = "e2740b75997e9e3d0776f6b80846cafc2681fe29" }

# root と同じく、開発用の build でも str0m の再帰が tokio の worker（2 MiB）を溢れないようにする（#1658）。
[profile.dev.package.str0m]
opt-level = 1
