[package]
name = "kukuri-desktop-tauri"
version = "0.2.8"
edition = "2024"
default-run = "kukuri-desktop-tauri"

[lib]
name = "kukuri_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
microsoft-store = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
html5ever = "0.38.0"
kukuri-app-api = { path = "../../../crates/app-api" }
kukuri-core = { path = "../../../crates/core" }
kukuri-desktop-runtime = { path = "../../../crates/desktop-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["time", "signal", "sync", "net", "macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
open = { version = "5.4.3", features = ["shellexecute-on-windows"] }
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Globalization", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
# Keep zbus's blocking Secret Service client compatible with async startup.
# Enabling ashpd/tokio also enables zbus/tokio through Cargo feature unification.
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "open_uri"] }
zbus = "5"

[dev-dependencies]
minisign-verify = "0.2"
tauri = { version = "2.11.5", features = ["test"] }
tempfile = "3.27.0"

[patch.crates-io]
netwatch = { git = "https://github.com/n0-computer/net-tools", rev = "e9afb4dda300dda06193b5046ba7a05e5d176e22" }
# Keep the standalone Tauri workspace on the same docs error-path fix as the root.
iroh-docs = { git = "https://github.com/n0-computer/iroh-docs", rev = "e7233d14853cb4db9966e30050bac1e689cdeec8" }
