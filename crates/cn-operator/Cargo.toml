[package]
name = "kukuri-cn-operator"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.kukuri]
cn-lane = true

[lib]
name = "kukuri_cn_operator"
path = "src/lib.rs"

[[bin]]
name = "cn-operator"
path = "src/main.rs"

[features]
safety-mock = ["kukuri-cn-safety/mock", "dep:tokio"]
# `safety test-provider project-arachnid-shield`（実 API への connectivity check、#391）。
safety-arachnid = ["dep:kukuri-cn-safety-arachnid", "dep:tokio"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
chrono.workspace = true
clap.workspace = true
kukuri-cn-safety = { path = "../cn-safety" }
kukuri-cn-safety-arachnid = { path = "../cn-safety-arachnid", optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
url.workspace = true
tokio = { workspace = true, optional = true, features = ["fs", "rt-multi-thread"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
