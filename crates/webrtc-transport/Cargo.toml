[package]
name = "kukuri-webrtc-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytes = "1.12.1"
getrandom = "0.3.4"
iroh = { workspace = true, features = ["unstable-custom-transports"] }
iroh-base = "1.3.0"
n0-future = "0.3.2"
n0-watcher = "1.0.0"
noq-udp = { version = "1.3.0", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "sync"] }
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
str0m = { version = "0.24.0", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
  "MessageEvent",
  "RtcConfiguration",
  "RtcDataChannel",
  "RtcDataChannelInit",
  "RtcDataChannelState",
  "RtcDataChannelType",
  "RtcIceGatheringState",
  "RtcPeerConnection",
  "RtcPeerConnectionState",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
axum.workspace = true
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
web-sys = { version = "0.3.106", features = ["Window", "RequestInit", "Response"] }

[[example]]
name = "webrtc_peer"
test = false

[lints]
workspace = true
