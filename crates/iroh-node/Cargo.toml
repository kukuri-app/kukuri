[package]
name = "kukuri-iroh-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
web-time.workspace = true
n0-future.workspace = true
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
bao-tree.workspace = true
futures-util.workspace = true
hex.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
iroh-docs.workspace = true
iroh-gossip.workspace = true
irpc = { version = "0.17.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
kukuri-core = { path = "../core" }
kukuri-store = { path = "../store" }
kukuri-transport = { path = "../transport" }
kukuri-webrtc-transport = { path = "../webrtc-transport" }

# 永続 store・rpc・file は native だけ（ADR 0056 §3、ADR 0058）。
[target.'cfg(not(target_family = "wasm"))'.dependencies]
iroh-blobs = { workspace = true, features = ["fs-store", "hide-proto-docs", "rpc"] }
iroh-docs = { workspace = true, features = ["fs-store", "metrics", "redb-v2-migration", "rpc"] }
tokio = { workspace = true, features = ["fs", "rt-multi-thread"] }
# 公開 blob の発見（#1632、ADR 0063）。DHT は UDP を使うので native だけ。
n0-mainline.workspace = true
iroh-mainline-endpoint-discovery.workspace = true

[dev-dependencies]
kukuri-webrtc-transport = { path = "../webrtc-transport", features = ["test-signaling"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
axum.workspace = true
iroh = { workspace = true, features = ["test-utils"] }
tempfile.workspace = true
# 公開 blob の発見の試験（#1632）: loopback の Testnet と補助 index の server。
iroh-mainline-address-lookup.workspace = true
udp-addr-index.workspace = true

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"

# browser↔native の有界な読み出しの native 側（scripts/ci/browser_peer_test.sh）。
[[example]]
name = "web_peer"
test = false

[lints]
workspace = true
