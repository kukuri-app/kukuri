[package]
name = "kukuri-iroh-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
web-time.workspace = true
n0-future.workspace = true
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
bao-tree.workspace = true
futures-util.workspace = true
hex.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
iroh-docs.workspace = true
iroh-gossip.workspace = true
irpc = { version = "0.17.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
kukuri-core = { path = "../core" }
kukuri-store = { path = "../store" }
kukuri-transport = { path = "../transport" }

# 永続 store・rpc・file は native だけ（ADR 0056 §3、ADR 0058）。
[target.'cfg(not(target_family = "wasm"))'.dependencies]
iroh-blobs = { workspace = true, features = ["fs-store", "hide-proto-docs", "rpc"] }
iroh-docs = { workspace = true, features = ["fs-store", "metrics", "redb-v2-migration", "rpc"] }
tokio = { workspace = true, features = ["fs", "rt-multi-thread"] }

[dev-dependencies]
iroh = { workspace = true, features = ["test-utils"] }
tempfile.workspace = true

[lints]
workspace = true
