[package]
name = "kukuri-app-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true
kukuri-core = { path = "../core" }
kukuri-blob-service = { path = "../blob-service" }
kukuri-docs-sync = { path = "../docs-sync" }
kukuri-store = { path = "../store" }
kukuri-transport = { path = "../transport" }
kukuri-metaverse-host = { path = "../metaverse-host" }
ts-rs = { workspace = true, optional = true }

[features]
# IPC 型の TypeScript 生成専用(codegen 時のみ有効。production ビルドは無影響)。
ts = ["dep:ts-rs", "kukuri-core/ts", "kukuri-store/ts", "kukuri-transport/ts"]
iroh-integration-tests = []

[dev-dependencies]
sqlx.workspace = true
kukuri-store = { path = "../store", features = ["test-support"] }
kukuri-test-support = { path = "../test-support" }
kukuri-iroh-node = { path = "../iroh-node" }
tempfile.workspace = true
iroh-mainline-address-lookup.workspace = true
n0-mainline.workspace = true
iroh = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
