[package]
name = "kukuri-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
futures-util.workspace = true
iroh.workspace = true
iroh-gossip.workspace = true
n0-mainline.workspace = true
iroh-mainline-address-lookup.workspace = true
pkarr.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
kukuri-core = { path = "../core" }
kukuri-store = { path = "../store" }
ts-rs = { workspace = true, optional = true }

[features]
# IPC 型の TypeScript 生成専用(codegen 時のみ有効)。
ts = ["dep:ts-rs", "kukuri-core/ts"]

[dev-dependencies]
iroh = { workspace = true, features = ["test-utils"] }
rand = { version = "=0.10.1", features = ["std_rng"] }
postcard = { version = "=1.1.3", features = ["alloc"] }
n0-future = "=0.3.2"
tempfile.workspace = true

[lints]
workspace = true
