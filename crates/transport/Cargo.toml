[package]
name = "kukuri-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
n0-future.workspace = true
web-time.workspace = true
anyhow.workspace = true
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
futures-util.workspace = true
iroh.workspace = true
iroh-gossip.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
kukuri-core = { path = "../core" }
kukuri-store = { path = "../store" }
ts-rs = { workspace = true, optional = true }

# DHT は UDP を使うので native だけ（ADR 0056 §3）。
[target.'cfg(not(target_family = "wasm"))'.dependencies]
n0-mainline.workspace = true
iroh-mainline-address-lookup.workspace = true
iroh-mainline-endpoint-discovery.workspace = true

[features]
# IPC 型の TypeScript 生成専用(codegen 時のみ有効)。
ts = ["dep:ts-rs", "kukuri-core/ts"]
# 計測用の状態の読取りの数(`IrohGossipTransport::status_read_steps`)。test からだけ有効にする。
test-support = []

[dev-dependencies]
kukuri-store = { path = "../store", features = ["test-support"] }
iroh = { workspace = true, features = ["test-utils"] }
rand = { version = "=0.10.3", features = ["std_rng"] }
postcard = { version = "=1.1.3", features = ["alloc"] }
tempfile.workspace = true

[lints]
workspace = true
