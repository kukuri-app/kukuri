[package]
name = "kukuri-game-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kukuri-sdk-sidecar"
path = "src/bin/sidecar.rs"

# 性能の計測（ADR 0070 §8.4）で全 process の packet を通す UDP proxy（#1984）。
[[bin]]
name = "kukuri-sdk-net-proxy"
path = "src/bin/net_proxy.rs"

[features]
# libvpx による VP8 の圧縮・復号と、視聴の音声の再生（Live の配信・視聴。#1982）。`KUKURI_LIBVPX_DIR` が要る。
vp8 = ["kukuri-desktop-runtime/audio-devices"]

[build-dependencies]
cc = "1.11.0"
serde_json.workspace = true

[dependencies]
async-trait.workspace = true
blake3.workspace = true
futures-util.workspace = true
kukuri-cli = { path = "../kukuri-cli" }
kukuri-desktop-runtime = { path = "../desktop-runtime" }
kukuri-transport = { path = "../transport" }
socket2 = "0.6.5"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "signal"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
